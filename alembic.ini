# Alembic configuration for crypto-bot
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Нужно изменить при использовании PostgreSQL
# Для SQLite: sqlite:///./cryptobot.db
# Для PostgreSQL: postgresql+asyncpg://bot:password@localhost:5432/cryptobot
sqlalchemy.url = driver://user:pass@localhost/dbname

# Директория с миграциями
script_location = alembic

# render_as_batch передаётся программно в alembic/env.py (context.configure),
# сюда его класть нельзя — просочится как невалидный аргумент в create_engine().

# Фабрика контекста — импортируем Base из моделей
# Это позволяет Alembic генерировать миграции на основе моделей
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

# Опционально: autogeneration миграций
# alembic revision --autogenerate -m "description"

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5s [%(name)s] %(message)s
datefmt = %H:%M:%S
