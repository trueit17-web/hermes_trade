[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Осознанно выбранный, стабильный набор правил вместо ruff-дефолта:
# без явного select CI ловил дефолтный ruleset ТЕКУЩЕЙ версии ruff (которая
# в CI ставится без пиновки — `pip install ruff`), а он менялся между
# релизами и без единого изменения кода число ошибок могло скакнуть с
# нескольких десятков до полутысячи. E4/E7/E9 — ошибки pycodestyle,
# F — pyflakes (неиспользуемые импорты/переменные, undefined name и т.п.),
# I — сортировка импортов (isort), UP — модернизация синтаксиса (pyupgrade).
#
# Сознательно НЕ включены: BLE (запрет широкого except Exception) — бот
# намеренно ловит Exception почти везде, чтобы сетевой сбой/сбой парсинга
# одного сигнала не ронял основной цикл целиком; S (flake8-bandit) и
# ASYNC (flake8-async) — по тем же соображениям (например, silent
# except-pass в обработчике логов — стандартная практика для Handler.emit,
# не баг); SIM (flake8-simplify) — вложенные if в торговой/сигнальной
# логике местами читаются понятнее одной строки с `and`, свёртка не стоит
# риска случайно изменить условие в коде, который открывает/закрывает
# позиции. PL*/RUF (pylint/ruff-specific) — слишком шумные для точечного
# принятия без ревью каждого правила.
select = ["E4", "E7", "E9", "F", "I", "UP"]
