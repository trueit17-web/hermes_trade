services:
  bot:
    build: .
    restart: unless-stopped
    # Все переменные из .env (ключи бирж, Telegram, торговая вселенная,
    # ML, риск, веб-логин и т.д.) прокидываются в контейнер целиком —
    # раньше здесь был жёстко прописанный список из части переменных,
    # из-за чего всё, что в него не попало (включая WEB_ADMIN_PASSWORD),
    # молча падало на дефолт из кода независимо от содержимого .env.
    env_file:
      - .env
    environment:
      # Эти четыре — специфичны для docker-compose сети (хосты db/redis
      # видны только внутри неё) и намеренно переопределяют .env, если он
      # тоже их задаёт: environment: имеет приоритет над env_file:.
      - DATABASE_URL=postgresql+asyncpg://bot:${DB_PASSWORD:-password}@db:5432/cryptobot
      - REDIS_URL=redis://redis:6379
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: cryptobot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d cryptobot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: web-panel as separate service (if split UI)
  # web:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.web
  #   restart: unless-stopped
  #   environment:
  #     - DATABASE_URL=postgresql://bot:${DB_PASSWORD:-password}@db:5432/cryptobot
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - db

volumes:
  pgdata:
  redisdata:
