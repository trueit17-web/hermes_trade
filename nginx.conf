# Nginx reverse-proxy для CryptoBot Pro (веб-API + WebSocket на порту 8000).
# Использование (см. README, раздел "Развёртывание на VPS" -> "Nginx reverse proxy"):
#   sudo cp nginx.conf /etc/nginx/sites-available/cryptobot
#   sudo ln -s /etc/nginx/sites-available/cryptobot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.com   # добавит SSL-блок автоматически

upstream cryptobot_bot {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    location /ws {
        proxy_pass http://cryptobot_bot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://cryptobot_bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
